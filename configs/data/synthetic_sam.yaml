# Dataset overlay: synthetic_sam, a LABEL PROBE, not a training set. Do not train on it.
# Same RSA discs as the default synthetic (non-overlapping, phi 0.25, 512^2) with its own layout seed, rendered
# by render_grayscale and then degraded so that a single global threshold fails while every disc stays a
# closed object with a locally visible edge (see make_dataset.degrade):
#   - illumination ramp across x larger than the phase contrast (0.5 vs 0.70 - 0.35),
#   - per-phase Gaussian noise so the two gray histograms overlap,
#   - a thin dark rim around each disc.
# The clean mask is saved as data/raw/synthetic_sam/micro_2d_gt.png and used only to score Otsu and SAM.
# Usage: make data DATA=configs/data/synthetic_sam.yaml ; make sam DATA=configs/data/synthetic_sam.yaml
# Probe result (vs the clean mask, phi 0.250):
#   Otsu                          IoU 0.430, phi 0.467
#   SAM, global rule (sam.classify: global, as for M3)   IoU 0.455, phi 0.123 (dark half missed: IoU 0.019)
#   SAM, local contrast (sam.classify: local, below)     IoU 0.931, phi 0.257 (left 0.932 / right 0.930)
data:
  name: synthetic_sam
  source: synthetic
  synthetic:
    seed: 7                   # own RSA layout (the default synthetic uses the global seed 42)
    noise_std: 0.0            # replaced by the per-phase noise below
    ramp_amplitude: 0.5       # total change across x; Otsu IoU vs GT 0.43 (default synthetic: 0.913)
    noise_std_matrix: 0.08
    noise_std_inclusion: 0.08
    rim_depth: 0.25
    rim_width: 1

sam:
  classify: local             # each mask group vs a ring around it; the global rule fails on the ramp
