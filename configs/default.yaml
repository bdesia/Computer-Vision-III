# Base configuration shared by M1/M2/M3. Model configs override keys via `base:`.
seed: 42
img_size: 64            # 2D training crop size fed to D
volume_size: 64         # generated cube edge (64^3)
epochs: 50              # raise if GPU available; report the value actually used
iters_per_epoch: 100    # generator updates per epoch (critic runs critic_iters x this)
batch_size: 8
z_channels: 32          # upstream run_slicegan.py value (G architecture is kept unchanged)
n_phases: 2
device: cuda            # falls back to cpu (logged as WARNING) if CUDA is unavailable

# `{data_name}` is replaced by data.name, so each dataset gets its own data/model/log folders.
paths:
  raw: data/raw/{data_name}
  interim: data/interim/{data_name}
  processed: data/processed/{data_name}
  models: models/{data_name}
  logs: logs/{data_name}
  figures: reports/figures
  reports: reports
  slicegan: external/SliceGAN

# Default dataset: synthetic. Real data is selected with a dataset overlay, e.g.
#   --data configs/data/microlib_000210.yaml
data:
  name: synthetic
  source: synthetic     # synthetic | slicegan | microlib
  raw_path: data/raw/{data_name}/micro_2d.png   # grayscale micrograph (written here when synthetic)
  slicegan_example: null            # file name under external/SliceGAN/Examples/ when source == slicegan
  inclusion_is_minority: true       # after thresholding, label 1 = minority phase
  branch: raw           # raw -> train_2d (M1/M2) | sam -> train_sam (M3)
  train_dirs:
    raw: data/processed/{data_name}/train_2d
    sam: data/processed/{data_name}/train_sam
  crop_stride: 32
  synthetic:            # RSA circular inclusions (fallback / debug)
    canvas: 512
    phi_target: 0.25
    radius_min: 6
    radius_max: 14
    min_gap: 1          # pixels between discs (keeps discs pixel-disjoint)
    max_attempts: 200000
    # Grayscale rendering so thresholding / SAM have a non-trivial task
    intensity_matrix: 0.35
    intensity_inclusion: 0.70
    blur_sigma: 1.5
    noise_std: 0.05     # Otsu IoU vs GT ~0.91 at this level; 0.08 drops it to ~0.80

model:
  discriminator: cnn    # cnn | swin
  swin:
    # Microsoft Swin-T ImageNet-1k weights (HF Hub: timm/swin_tiny_patch4_window7_224.ms_in1k,
    # same checkpoint as microsoft/swin-tiny-patch4-window7-224). timm is used because it shrinks
    # windows and resizes the relative-position bias for small inputs; HF transformers crashes at 64px.
    backbone: swin_tiny_patch4_window7_224.ms_in1k
    input_size: 64      # native 64x64 slices (Swin-T has no absolute pos-embed); 224 = bilinear upsample
    upsample: bilinear  # only used when input_size != img_size
    pretrained: true
    trainable_stages: [3, 4]   # train head + last stages; patch embed and stages 1-2 frozen

train:
  lr_g: 0.0001
  lr_d: 0.0001
  betas: [0.9, 0.99]
  critic_iters: 5       # D updates per G update (WGAN-GP)
  gp_lambda: 10
  d_batch_size: 8       # volumes generated per critic step (upstream D_batch_size)
  fake_slices: 64       # random fake slices per axis fed to D, same for all models; null = all 512 (upstream)
  allow_tf32: true      # TF32 matmuls on Ampere+ (applied to every model)
  max_minutes: null     # optional wall-clock budget; stops cleanly and checkpoints
  cudnn_benchmark: true
  log_every: 10         # G steps
  ckpt_every: 5         # epochs

sam:
  model_id: facebook/sam-vit-base
  points_per_side: 16
  merge_iou: 0.3
  n_gt_crops: 5
  gt_dir: data/processed/{data_name}/sam_gt

generate:
  n_volumes: 4
  seeds: [0, 1, 2, 3]

metrics:
  s2_rmax: 32

logging:
  level: INFO
