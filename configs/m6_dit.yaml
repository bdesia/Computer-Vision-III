# M6 — diffusion transformer instead of SliceGAN (presentation extra; report Section 6, "Ongoing work").
# A 2D DiT (Peebles & Xie, 2023) learns to denoise 64 x 64 crops of the training micrograph (Otsu map);
# 64^3 volumes are sampled from 3D noise by multi-plane DDIM (Micro3Diff, Lee & Yun 2024): at each step the
# noise of the volume is predicted slice by slice along z, y and x and averaged. No critic, no GAN loss.
base: default.yaml
run_name: m6_dit

epochs: 30                 # 30 x 1000 denoising steps (batch 128): about 3 h on an RTX A2000
iters_per_epoch: 1000

model:
  generator: dit
  dit:
    patch: 4               # 16 x 16 tokens per 64 x 64 slice
    dim: 384
    depth: 8
    heads: 6
    mlp_ratio: 4.0         # 21.8 M parameters
    timesteps: 1000        # cosine schedule, epsilon prediction
    sample_steps: 50       # DDIM steps for evaluation volumes
    sample_mode: average   # average | cycle (one axis per step)
    sample_chunk: 64       # slices per DiT forward pass

data:
  branch: raw

train:
  batch: 128
  lr: 1.0e-4
  warmup_steps: 1000
  ema_decay: 0.999
  grad_clip: 1.0
  log_every: 100
  val_volumes: 8           # per-epoch selection: 8 volumes from train.select_seeds, faster sampler
  val_steps: 25
  val_mode: average
  snapshot_every: 5

generate:
  checkpoint: auto         # best / last / snapshots, chosen on the validation seeds below
  validation_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
