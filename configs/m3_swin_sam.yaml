# M3 — SliceGAN-Swin+SAM: same G and Swin D as M2, trained on the SAM phase map.
base: default.yaml
run_name: m3_swin_sam

data:
  branch: sam

# Swin critic learning rate (final setup = run v2). With the shared lr_d = 1e-4 (v1) the Swin critic
# oscillated between realistic and empty volumes; 2e-5 still oscillates but reaches M1-level epochs,
# which best-checkpoint selection keeps. ViTGAN stabilizers (ISN, Adam beta1 = 0, G EMA; v3) and a
# smaller critic (stage 4 only) were tried and performed worse; see README.
model:
  discriminator: swin

train:
  lr_d: 2.0e-5
