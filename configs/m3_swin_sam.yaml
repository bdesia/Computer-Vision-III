# M3 — SliceGAN-Swin+SAM: same G and Swin D as M2, trained on the SAM phase map.
base: default.yaml
run_name: m3_swin_sam

model:
  discriminator: swin

data:
  branch: sam

# Lower critic learning rate for the pretrained Swin backbone: with the shared 1e-4 the Swin critic
# oscillated between realistic and empty volumes (run v1). G keeps lr_g = 1e-4 as in M1.
train:
  lr_d: 2.0e-5
