# M3 — SliceGAN-Swin+SAM: same G and Swin D as M2, trained on the SAM phase map.
base: default.yaml
run_name: m3_swin_sam

data:
  branch: sam

# Final Swin critic setup (= probe B): stages 3-4 trainable, lr_d 2e-5, WGAN-GP, plus DiffAug on the critic
# inputs. Without DiffAug (v1, v2) the critic oscillated between realistic and empty volumes; with it the
# best held-out S2 MAE matches M1 (0.0035). ViTGAN stabilizers (v3), a smaller critic, and frozen-backbone
# critics (WGAN-GP or hinge) were tried and performed worse; see README / report Section 5.2.
model:
  discriminator: swin

train:
  lr_d: 2.0e-5
  diffaug:
    policy: [translation, cutout, d4]

# Future M3-style run on the synthetic_sam label probe (not created). SAM with local-contrast labeling wins
# the probe (IoU 0.931 vs Otsu 0.430, phi 0.257 vs true 0.250); the overlay sets sam.classify: local:
# make sam DATA=configs/data/synthetic_sam.yaml && make train-m3 DATA=configs/data/synthetic_sam.yaml
