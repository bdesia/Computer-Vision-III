[project]
name = "tf-vit-slicegan"
version = "0.1.0"
description = "SliceGAN with a Swin-T discriminator and a SAM phase front-end (FIUBA Vision Transformers final project)"
authors = [{ name = "bdesia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # PyTorch: source (cu124 / cpu) is selected by setup.sh via DEVICE
    # Hugging Face: Swin-T discriminator + SAM ViT-B
    "transformers==4.46.3",
    "huggingface-hub==0.26.2",
    # Scientific stack
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-image==0.24.0",
    "tifffile==2024.9.20",
    "pillow==10.4.0",
    "matplotlib==3.9.2",
    # Config / utilities
    "pyyaml==6.0.2",
    "tqdm==4.66.5",
    "torch (==2.5.1)",
    "torchvision (==0.20.1)",
    "timm (==1.0.11)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = {source = "pytorch-cu124"}
torchvision = {source = "pytorch-cu124"}

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
ipykernel = "6.29.5"
jupyterlab-widgets = "3.0.13"
widgetsnbextension = "4.0.13"

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
